<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Deutsch A1–B1 | Goethe Exam Prep</title>
  <meta name="theme-color" content="#c8102e">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DeutschWeg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" onclick="showView('dashboard')">
      <span class="brand-flag">🇩🇪</span>
      <span class="brand-name">DeutschWeg</span>
      <span class="brand-sub">A1 → B1</span>
    </div>
    <nav class="main-nav">
      <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')">🏠 Start</button>
      <button class="nav-btn" data-view="grammar" onclick="showView('grammar')">📖 Grammatik</button>
      <button class="nav-btn" data-view="vocab" onclick="showView('vocab')">🃏 Vokabeln</button>
      <button class="nav-btn" data-view="listening" onclick="showView('listening')">🎧 Hören</button>
      <button class="nav-btn" data-view="quiz" onclick="showView('quiz')">✏️ Quiz</button>
      <button class="nav-btn" data-view="exam" onclick="showView('exam')">🎓 Goethe-Prüfung</button>
      <button class="nav-btn" data-view="jobs" onclick="showView('jobs')">💼 Berufe</button>
    </nav>
    <div class="level-picker">
      <button class="level-btn active" data-level="A1" onclick="setLevel('A1')">A1</button>
      <button class="level-btn" data-level="A2" onclick="setLevel('A2')">A2</button>
      <button class="level-btn" data-level="B1" onclick="setLevel('B1')">B1</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <p>DeutschWeg — your path from A1 to B1 and the Goethe-Zertifikat. Viel Erfolg! 💪</p>
    <p class="footer-small">Progress is saved locally in your browser. Official exam materials: <a href="https://www.goethe.de/en/spr/prf.html" target="_blank" rel="noopener">goethe.de</a></p>
  </footer>

  <script src="js/data/grammar.js"></script>
  <script src="js/data/vocab.js"></script>
  <script src="js/data/quizzes.js"></script>
  <script src="js/data/listening.js"></script>
  <script src="js/data/exam.js"></script>
  <script src="js/data/jobs.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
